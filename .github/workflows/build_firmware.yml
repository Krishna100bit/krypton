name: Build Firmware (Krypton UF2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Zephyr UF2 Firmware
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
      options: --user root

    env:
      ACCEPT_JLINK_LICENSE: '1'

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout Firmware Source
        uses: actions/checkout@v4
        with:
          path: app_source

      - name: Locate or Setup West Toolchain
        run: |
          echo "=== Locating West and Python Environment ==="
          
          # If west is not in PATH, search for existing venv or binary
          if ! command -v west &> /dev/null; then
            echo "Searching for virtual environment or west binary..."
            
            # Check for virtualenv activate scripts in toolchain directories
            VENV_ACTIVATE=$(find /opt /root /home /var /usr -name "activate" 2>/dev/null | head -n 1)
            if [ -n "$VENV_ACTIVATE" ]; then
              echo "Found virtual environment activate script: $VENV_ACTIVATE"
              VENV_BIN=$(dirname "$VENV_ACTIVATE")
              echo "$VENV_BIN" >> $GITHUB_PATH
              export PATH="$VENV_BIN:$PATH"
            fi
            
            # If still not in PATH, search for west executable directly
            if ! command -v west &> /dev/null; then
              WEST_BIN=$(find /opt /root /home /usr -name "west" -type f 2>/dev/null | head -n 1)
              if [ -n "$WEST_BIN" ]; then
                echo "Found west executable: $WEST_BIN"
                WEST_DIR=$(dirname "$WEST_BIN")
                echo "$WEST_DIR" >> $GITHUB_PATH
                export PATH="$WEST_DIR:$PATH"
              fi
            fi
            
            # If still not found, install west using python pip
            if ! command -v west &> /dev/null; then
              echo "West not found. Installing via pip..."
              python3 -m pip install --break-system-packages west 2>/dev/null || python3 -m pip install west 2>/dev/null || pip3 install west
              USER_BIN="$HOME/.local/bin"
              if [ -d "$USER_BIN" ]; then
                echo "$USER_BIN" >> $GITHUB_PATH
                export PATH="$USER_BIN:$PATH"
              fi
            fi
          fi
          
          echo "West binary location: $(which west)"
          west --version

      - name: Cache nRF Connect SDK Workspace
        uses: actions/cache@v4
        id: cache-ncs
        with:
          path: ncs-workspace
          key: ncs-v3.4.0-${{ runner.os }}

      - name: Initialize NCS West Workspace (if not cached)
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ncs-workspace
          cd ncs-workspace
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.4.0
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Export Zephyr CMake (Cached)
        if: steps.cache-ncs.outputs.cache-hit == 'true'
        run: |
          cd ncs-workspace
          west zephyr-export

      - name: Compile Krypton Firmware with West
        run: |
          cd ncs-workspace
          west build -p always -b xiao_ble/nrf52840/sense -d "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/app_source"

      - name: Package Firmware Artifacts
        run: |
          ls -lh "$GITHUB_WORKSPACE/build/zephyr"
          # Create friendly Krypton named copies alongside default Zephyr binaries
          if [ -f "$GITHUB_WORKSPACE/build/zephyr/zephyr.uf2" ]; then
            cp "$GITHUB_WORKSPACE/build/zephyr/zephyr.uf2" "$GITHUB_WORKSPACE/build/zephyr/krypton.uf2"
          fi
          if [ -f "$GITHUB_WORKSPACE/build/zephyr/zephyr.hex" ]; then
            cp "$GITHUB_WORKSPACE/build/zephyr/zephyr.hex" "$GITHUB_WORKSPACE/build/zephyr/krypton.hex"
          fi
          if [ -f "$GITHUB_WORKSPACE/build/zephyr/zephyr.bin" ]; then
            cp "$GITHUB_WORKSPACE/build/zephyr/zephyr.bin" "$GITHUB_WORKSPACE/build/zephyr/krypton.bin"
          fi

      - name: Upload UF2 & HEX Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krypton-firmware-uf2
          path: |
            build/zephyr/krypton.uf2
            build/zephyr/zephyr.uf2
            build/zephyr/krypton.hex
            build/zephyr/zephyr.hex
            build/zephyr/krypton.bin
            build/zephyr/zephyr.bin
          if-no-files-found: error
